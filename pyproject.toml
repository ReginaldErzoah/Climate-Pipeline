[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "climate-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "supabase>=2.34.1",
    "python-dotenv>=1.2.4",
    "prefect>=3.9.3",
]

[tool.uv]
package = true
