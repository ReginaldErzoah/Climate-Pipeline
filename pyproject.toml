[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[project]
name = "climate-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pandas",
    "supabase>=2.34.1",
    "python-dotenv>=1.2.4",
    "prefect>=3.9.3",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]